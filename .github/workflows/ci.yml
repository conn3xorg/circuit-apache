name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          # systemd in the host container is simplest under rootful Podman.
          PODMAN: sudo podman
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
          sudo podman exec circuit-apache sh -c 'systemctl is-active apache2 || systemctl is-active httpd'
      # www.example.test serves /srv/www, app.example.test proxies to the
      # backend virtual host on :8081, and ServerTokens comes from
      # extra_config.
      - name: Fetch a page, and a page through the reverse proxy
        run: &check |
          sudo podman exec -i circuit-apache sh -eu <<'EOF'
          [ "$(curl -sSf -H 'Host: www.example.test' localhost:8080/)" = 'Hello from Apache.' ]
          [ "$(curl -sSf -H 'Host: example.test' localhost:8080/)" = 'Hello from Apache.' ]
          out=$(curl -sSfi -H 'Host: app.example.test' localhost:8080/ | tr -d '\r')
          echo "$out"
          echo "$out" | grep -qi '^x-proxied-by: apache$'
          echo "$out" | grep -qx 'Hello from the backend.'
          echo "$out" | grep -qx 'Server: Apache'
          EOF
      # Restarting the container boots systemd again, so this checks Apache
      # comes back by itself, still serves both names, and the plan has
      # nothing to do.
      - name: Restart the host, then fetch the pages again and plan
        working-directory: examples/local
        run: |
          sudo podman restart circuit-apache
          for _ in $(seq 60); do
            case $(sudo podman exec circuit-apache systemctl is-system-running 2>/dev/null) in running|degraded) break ;; esac
            sleep 1
          done
          conn3x plan -detailed-exitcode
      - name: Fetch the pages after the restart
        run: *check
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh

